    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=attendance_db;Username=postgres;Password=postgres
      - Jwt__Secret=HAF-Microservices-JWT-Secret-Key-2026-Bradford-Council-Secure
      - Jwt__Issuer=haf-identity-service
      - Jwt__Audience=haf-microservices
      - RabbitMQ__Host=rabbitmq
    depends_on:
