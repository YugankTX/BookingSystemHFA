    environment:
      - Jwt__Secret=HAF-Microservices-JWT-Secret-Key-2026-Bradford-Council-Secure
      - Jwt__Issuer=haf-identity-service
      - Jwt__Audience=haf-microservices
      - Services__IdentityService=http://identity-service:8080
      - Services__ProgramService=http://program-service:8080
      - Services__ClubActivityService=http://club-activity-service:8080
      - Services__FamilyService=http://family-service:8080
      - Services__BookingService=http://booking-service:8080
      - Services__ComplianceService=http://compliance-service:8080
    depends_on:
      - identity-service
      - program-service
      - club-activity-service
      - family-service
      - booking-service
      - compliance-service

  notification-service:
    build:
      context: .
